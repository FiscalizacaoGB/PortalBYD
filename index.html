.hero h1 span {
  display: block;
  font-size: 34px;
  color: var(--azul-claro);
}

.hero h1 span b { color: #fff; }

.container {
  max-width: 540px;
  margin: -18px auto 20px;
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  position: relative;
  box-shadow: 0 6px 20px rgba(11,37,69,.12);
}

.intro {
  margin: 0 0 14px;
  font-size: 15px;
  color: #374151;
}

.intro strong { color: var(--azul); }

/* TABS */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.tabs button {
  flex: 1;
  padding: 10px;
  background: #e5e7eb;
  color: var(--azul);
  border-radius: 8px;
}

.tabs button.active {
  background: var(--azul);
  color: #fff;
}

.hidden { display: none !important; }

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: 1px solid #d1d5db;
  font-size: 15px;
}

input:focus {
  outline: 2px solid var(--azul-claro);
  border-color: var(--azul-claro);
}

button {
  width: 100%;
  padding: 12px;
  background: var(--azul);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

button:disabled { opacity: .6; cursor: wait; }

.btn-ajuda {
  margin-top: 18px;
  background: #fff;
  color: var(--azul);
  border: 2px dashed var(--azul-claro);
  font-size: 15px;
}

#loading {
  display: none;
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
  color: var(--azul);
}

.msg {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  background: #fff7e6;
  border-left: 5px solid var(--dourado);
  font-size: 14px;
}

/* CARDS */
.card {
  background: var(--cinza);
  border-left: 5px solid var(--azul);
  padding: 14px;
  margin-top: 15px;
  border-radius: 10px;
  font-size: 14px;
}

.card h3 {
  margin: 0 0 8px 0;
  color: var(--azul);
  font-size: 16px;
}

.card p { margin: 6px 0; }

.card .hora {
  display: inline-block;
  background: var(--azul);
  color: #fff;
  font-weight: bold;
  font-size: 18px;
  padding: 6px 12px;
  border-radius: 8px;
  margin: 4px 0 8px;
}

.card a.maps {
  display: block;
  text-align: center;
  margin-top: 10px;
  padding: 10px;
  background: var(--azul-claro);
  color: #fff;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}

/* OPÇÕES (vários resultados) */
.aviso-opcoes {
  margin-top: 15px;
  font-size: 14px;
  color: var(--azul);
  font-weight: bold;
}

.opcao {
  display: block;
  width: 100%;
  text-align: left;
  background: #fff;
  color: #1f2937;
  border: 1px solid #d1d5db;
  border-left: 5px solid var(--azul-claro);
  border-radius: 10px;
  padding: 12px 14px;
  margin-top: 10px;
  font-size: 14px;
}

.opcao strong { color: var(--azul); font-size: 15px; display: block; }
.opcao small { color: #6b7280; }
.opcao:hover { background: var(--cinza); }

.voltar {
  margin-top: 12px;
  background: #e5e7eb;
  color: var(--azul);
  font-size: 14px;
  padding: 10px;
}

/* MODAL QR CODE */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(11,37,69,.6);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 10;
}

.modal-box {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  max-width: 360px;
  width: 100%;
  text-align: center;
  border-top: 5px solid var(--azul);
}

.modal-box h3 { margin: 0 0 6px; color: var(--azul); }
.modal-box p { font-size: 14px; margin: 6px 0 12px; }

.modal-box img {
  width: 220px;
  max-width: 100%;
  image-rendering: pixelated;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 8px;
}

.modal-box a.link {
  display: block;
  margin: 12px 0;
  padding: 10px;
  background: var(--cinza);
  border-radius: 8px;
  color: var(--azul);
  font-weight: bold;
  word-break: break-all;
  font-size: 13px;
}

footer {
  text-align: center;
  font-size: 12px;
  color: #6b7280;
  padding: 0 16px 24px;
}
</style>
</head>

<script>
/* Cole aqui a URL do Web App publicado no Apps Script (termina em /exec) */
const API_URL = "https://script.google.com/macros/s/AKfycbwnbnrsiQFP9M_YQwCPnNzlZJBdoHHZ99mLmiBw4yyUSGenmbYRMO2MiEXFq8ebeXUF/exec";

/* Link contido no QR Code de atendimento */
const LINK_ATENDIMENTO = "https://docs.google.com/spreadsheets/d/1DztmVR7nasu8AmQB_FMxerTZ79UeJZ7bQrdvVd81dPM/edit?usp=sharing";

let abaAtual = "nome";
let ultimosResultados = [];
let totalResultados = 0;

/* TROCA DE ABAS */
function trocarAba(aba) {
  abaAtual = aba;
  document.getElementById("aba-nome").classList.toggle("hidden", aba !== "nome");
  document.getElementById("aba-email").classList.toggle("hidden", aba !== "email");
  document.querySelectorAll(".tabs button").forEach((b, i) =>
    b.classList.toggle("active", (i === 0) === (aba === "nome"))
  );
  document.getElementById("resultado").innerHTML = "";
  document.getElementById(aba === "nome" ? "campoNome" : "campoEmail").focus();
}

/* ENTER PESQUISA */
document.addEventListener("DOMContentLoaded", () => {
  ["campoNome", "campoEmail"].forEach(id =>
    document.getElementById(id).addEventListener("keydown", e => {
      if (e.key === "Enter") buscar();
    })
  );
  const link = document.getElementById("linkAtendimento");
  link.href = LINK_ATENDIMENTO;
  link.textContent = "Abrir atendimento";
});

/* Remove acentos e ignora maiúsculas/minúsculas */
function normalizar(txt) {
  return String(txt || "")
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();
}

/* Evita que dados da planilha quebrem o HTML */
function esc(txt) {
  return String(txt || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

/* CONSULTA */
function buscar() {
  const resultado = document.getElementById("resultado");
  const loading = document.getElementById("loading");
  const btn = document.getElementById("btnBuscar");
  const termo = normalizar(document.getElementById(abaAtual === "nome" ? "campoNome" : "campoEmail").value);

  resultado.innerHTML = "";

  if (abaAtual === "nome" && termo.length < 3) {
    resultado.innerHTML = `<div class="msg">Digite ao menos 3 letras do seu nome.</div>`;
    return;
  }
  if (abaAtual === "email" && termo.indexOf("@") === -1) {
    resultado.innerHTML = `<div class="msg">Digite um e-mail válido.</div>`;
    return;
  }

  loading.style.display = "block";
  btn.disabled = true;

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ tipo: abaAtual, termo })
  })
  .then(r => r.json())
  .then(dados => {
    if (!dados.ok) {
      resultado.innerHTML = `<div class="msg">${esc(dados.erro)}</div>`;
      return;
    }
    ultimosResultados = dados.resultados;
    totalResultados = dados.total;

    if (!dados.total) {
      resultado.innerHTML = `<div class="msg">Nenhum passageiro encontrado. Confira o que digitou ou clique em <strong>"Não encontrou seus dados?"</strong> abaixo.</div>`;
    } else if (dados.total === 1) {
      mostrarCard(0, false);
    } else {
      mostrarOpcoes(dados.total);
    }
  })
  .catch(() => {
    resultado.innerHTML = `<div class="msg">Não foi possível consultar agora. Tente novamente em instantes.</div>`;
  })
  .finally(() => {
    loading.style.display = "none";
    btn.disabled = false;
  });
}

/* VÁRIOS RESULTADOS: LISTA DE OPÇÕES */
function mostrarOpcoes(total) {
  const extra = total > ultimosResultados.length
    ? `<p class="msg">Mostrando ${ultimosResultados.length} de ${total}. Digite mais do seu nome para refinar.</p>`
    : "";

  document.getElementById("resultado").innerHTML = `
    <p class="aviso-opcoes">Encontramos ${total} passageiros. Selecione o seu:</p>
    ${ultimosResultados.map((p, i) => `
      <button class="opcao" onclick="mostrarCard(${i}, true)">
        <strong>${esc(p.nome)}</strong>
        <small>Linha: ${esc(p.linha) || "-"} · Ponto: ${esc(p.referencia) || "-"}</small>
      </button>`).join("")}
    ${extra}`;
}

/* CARD DO PASSAGEIRO */
function mostrarCard(i, comVoltar) {
  const p = ultimosResultados[i];
  const maps = /^https?:\/\//i.test(p.maps) ? p.maps : "";

  document.getElementById("resultado").innerHTML = `
    <div class="card">
      <h3>${esc(p.nome)}</h3>
      ${p.hora ? `<div class="hora">🕒 ${esc(p.hora)}</div>` : ""}
      <p><strong>Linha Vinculada:</strong> ${esc(p.linha) || "-"}</p>
      <p><strong>Ponto de Referência:</strong> ${esc(p.referencia) || "-"}</p>
      <p><strong>Endereço da Parada:</strong> ${esc(p.endereco) || "-"}</p>
      <p><strong>E-mail:</strong> ${esc(p.email) || "-"}</p>
      ${maps ? `<a class="maps" href="${esc(maps)}" target="_blank" rel="noopener">📍 Ver parada no Google Maps</a>` : ""}
    </div>
    ${comVoltar ? `<button class="voltar" onclick="mostrarOpcoes(totalResultados)">← Voltar para as opções</button>` : ""}`;
}

/* MODAL ATENDIMENTO */
function abrirAjuda() {
  document.getElementById("modalAjuda").classList.remove("hidden");
}

function fecharAjuda() {
  document.getElementById("modalAjuda").classList.add("hidden");
}
</script>
