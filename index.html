<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informações de Embarque BYD</title>

<style>
:root {
  --azul: #0d2f52;
  --azul-claro: #4ea3e8;
  --dourado: #f2b330;
  --cinza: #f1f5f9;
  --fundo: #f4f6f8;
}

/* TEMA HORA EXTRA: troca as cores principais para verde */
body.tema-he {
  --azul: #0f5f37;
  --azul-claro: #22a35a;
  --cinza: #ecf8f0;
  --fundo: #e9f5ee;
}

* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: var(--fundo);
  margin: 0;
  color: #1f2937;
}

header {
  background: #fff;
  padding: 12px 16px;
  border-bottom: 4px solid var(--azul);
  text-align: center;
}

header img {
  height: 56px;
  max-width: 100%;
  object-fit: contain;
}

/* FAIXA / BANNER */
.hero {
  background: linear-gradient(90deg, var(--azul) 0%, var(--azul) 55%, #5d8fc4 100%);
  overflow: hidden;
}

body.tema-he .hero {
  background: linear-gradient(90deg, var(--azul) 0%, var(--azul) 55%, #4fae78 100%);
}

.hero-inner {
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 14px 0 26px 0;
}

.hero-texto {
  position: relative;
  padding-left: 36px;
  flex: 1 1 auto;
  min-width: 0;
}

.hero-texto::before {
  content: "";
  position: absolute;
  left: 0;
  top: 52%;
  width: 26px;
  height: 3px;
  background: var(--dourado);
}

.hero h1 {
  margin: 0;
  color: #fff;
  font-size: 20px;
  line-height: 1.15;
  font-weight: 800;
  text-transform: uppercase;
}

.hero h1 span {
  display: block;
  font-size: 30px;
  color: var(--azul-claro);
}

body.tema-he .hero h1 span { color: #8ee0ae; }

.hero h1 span b { color: #fff; }

.hero-onibus {
  flex: 0 0 auto;
  width: 48%;
  max-width: 320px;
  height: auto;
  /* funde a borda esquerda da foto com a faixa */
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 30%);
  mask-image: linear-gradient(90deg, transparent 0%, #000 30%);
}

@media (max-width: 480px) {
  .hero-inner { gap: 0; }
  .hero-texto { padding-left: 30px; }
  .hero-texto::before { width: 20px; }
  .hero h1 { font-size: 15px; }
  .hero h1 span { font-size: 23px; }
  .hero-onibus { width: 50%; }
}

.container {
  max-width: 540px;
  margin: -18px auto 20px;
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  position: relative;
  box-shadow: 0 6px 20px rgba(11,37,69,.12);
}

.intro {
  margin: 0 0 14px;
  font-size: 15px;
  color: #374151;
}

.intro strong { color: var(--azul); }

/* TELA INICIAL */
.menu {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.menu button {
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  padding: 18px 16px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 12px;
}

.menu button small {
  display: block;
  font-size: 13px;
  font-weight: normal;
  opacity: .85;
  margin-top: 3px;
}

.menu .ico {
  font-size: 28px;
  line-height: 1;
}

.menu .btn-roteiro { background: #0d2f52; }
.menu .btn-he { background: #16884a; }

/* SELO DA PÁGINA */
.selo {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 14px;
}

.selo span {
  background: var(--azul);
  color: #fff;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .5px;
  text-transform: uppercase;
  padding: 6px 10px;
  border-radius: 20px;
}

.selo button {
  width: auto;
  padding: 6px 12px;
  font-size: 14px;
  background: #e5e7eb;
  color: #1f2937;
}

.aviso-he {
  background: #ecf8f0;
  border: 1px solid #b7e4c7;
  border-left: 5px solid #16884a;
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  margin-bottom: 14px;
  color: #0f5f37;
}

/* TABS */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.tabs button {
  flex: 1;
  padding: 10px;
  background: #e5e7eb;
  color: var(--azul);
  border-radius: 8px;
}

.tabs button.active {
  background: var(--azul);
  color: #fff;
}

.hidden { display: none !important; }

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: 1px solid #d1d5db;
  font-size: 15px;
}

input:focus {
  outline: 2px solid var(--azul-claro);
  border-color: var(--azul-claro);
}

button {
  width: 100%;
  padding: 12px;
  background: var(--azul);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

button:disabled { opacity: .6; cursor: wait; }

.btn-ajuda {
  margin-top: 18px;
  background: #fff;
  color: var(--azul);
  border: 2px dashed var(--azul-claro);
  font-size: 15px;
}

#loading {
  display: none;
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
  color: var(--azul);
}

.msg {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  background: #fff7e6;
  border-left: 5px solid var(--dourado);
  font-size: 14px;
}

/* CARDS */
.card {
  background: var(--cinza);
  border-left: 5px solid var(--azul);
  padding: 14px;
  margin-top: 15px;
  border-radius: 10px;
  font-size: 14px;
}

.card .tag {
  display: inline-block;
  background: #16884a;
  color: #fff;
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 12px;
  margin-bottom: 6px;
}

.card h3 {
  margin: 0 0 8px 0;
  color: var(--azul);
  font-size: 16px;
}

.card p { margin: 6px 0; }

.card .hora {
  display: inline-block;
  background: var(--azul);
  color: #fff;
  font-weight: bold;
  font-size: 18px;
  padding: 6px 12px;
  border-radius: 8px;
  margin: 4px 0 8px;
}

.card a.maps {
  display: block;
  text-align: center;
  margin-top: 10px;
  padding: 10px;
  background: var(--azul-claro);
  color: #fff;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}

/* OPÇÕES (vários resultados) */
.aviso-opcoes {
  margin-top: 15px;
  font-size: 14px;
  color: var(--azul);
  font-weight: bold;
}

.opcao {
  display: block;
  width: 100%;
  text-align: left;
  background: #fff;
  color: #1f2937;
  border: 1px solid #d1d5db;
  border-left: 5px solid var(--azul-claro);
  border-radius: 10px;
  padding: 12px 14px;
  margin-top: 10px;
  font-size: 14px;
}

.opcao strong { color: var(--azul); font-size: 15px; display: block; }
.opcao small { color: #6b7280; }
.opcao:hover { background: var(--cinza); }

.voltar {
  margin-top: 12px;
  background: #e5e7eb;
  color: var(--azul);
  font-size: 14px;
  padding: 10px;
}

footer {
  text-align: center;
  font-size: 12px;
  color: #6b7280;
  padding: 0 16px 24px;
}
/* SELETOR DE IDIOMA */
header { position: relative; }

.idiomas {
  position: absolute;
  top: 8px;
  right: 10px;
  display: flex;
  gap: 4px;
}

.idiomas button {
  width: auto;
  padding: 4px 8px;
  font-size: 12px;
  font-weight: bold;
  background: #e5e7eb;
  color: #374151;
  border-radius: 6px;
}

.idiomas button.active {
  background: var(--azul);
  color: #fff;
}

@media (max-width: 480px) {
  header { padding-top: 38px; }
}

/* ATENDIMENTO */
.menu .btn-at { background: #b26a00; }

body.tema-at .selo span { background: #b26a00; }

.fade { animation: aparecer .25s ease-out; }

@keyframes aparecer {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.campo { margin-bottom: 12px; }

.campo label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  color: var(--azul);
  margin-bottom: 4px;
}

.campo label small {
  font-weight: normal;
  color: #6b7280;
}

.campo input,
.campo select,
.campo textarea {
  width: 100%;
  padding: 12px;
  margin: 0;
  border-radius: 6px;
  border: 1px solid #d1d5db;
  font-size: 15px;
  font-family: inherit;
  background: #fff;
}

.campo textarea {
  min-height: 110px;
  resize: vertical;
}

.campo select:focus,
.campo textarea:focus {
  outline: 2px solid var(--azul-claro);
  border-color: var(--azul-claro);
}

.campo.erro input,
.campo.erro select,
.campo.erro textarea {
  border-color: #dc2626;
  background: #fef2f2;
}

.dica {
  font-size: 12px;
  color: #6b7280;
  margin: -2px 0 6px;
}

.contador {
  text-align: right;
  font-size: 12px;
  color: #6b7280;
  margin-top: 3px;
}

.loc {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.loc input { flex: 1 1 180px; }
.loc .btn-sec { flex: 1 1 auto; }

.btn-sec {
  width: auto;
  white-space: nowrap;
  padding: 10px 12px;
  font-size: 14px;
  background: #e5e7eb;
  color: var(--azul);
}

.loc-ok {
  font-size: 12px;
  color: #15803d;
  margin-top: 4px;
}

.isca { position: absolute; left: -9999px; }

.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 3px solid rgba(255,255,255,.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: girar .8s linear infinite;
  vertical-align: -3px;
  margin-right: 6px;
}

@keyframes girar { to { transform: rotate(360deg); } }

.sucesso {
  text-align: center;
  background: #ecf8f0;
  border: 1px solid #b7e4c7;
  border-radius: 12px;
  padding: 20px 16px;
}

.sucesso .check { font-size: 40px; }

.sucesso h3 {
  margin: 6px 0;
  color: #0f5f37;
}

.protocolo {
  display: inline-block;
  font-family: "Courier New", monospace;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 1px;
  color: var(--azul);
  background: #fff;
  border: 2px dashed var(--azul-claro);
  border-radius: 10px;
  padding: 10px 16px;
  margin: 10px 0;
}

.sucesso p { font-size: 14px; margin: 6px 0 12px; }

.sucesso .acoes {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.recentes {
  margin: 4px 0 14px;
  font-size: 13px;
  color: #6b7280;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}

.chips button {
  width: auto;
  padding: 6px 10px;
  font-size: 13px;
  font-family: "Courier New", monospace;
  font-weight: bold;
  background: var(--cinza);
  color: var(--azul);
  border: 1px solid #d1d5db;
  border-radius: 16px;
}

#campoProtocolo {
  text-transform: uppercase;
  font-family: "Courier New", monospace;
  font-weight: bold;
  letter-spacing: 1px;
}

.status {
  display: inline-block;
  font-size: 12px;
  font-weight: bold;
  padding: 4px 10px;
  border-radius: 12px;
  color: #fff;
}

.status.recebido { background: #6b7280; }
.status.andamento { background: #d97706; }
.status.finalizado { background: #15803d; }

.chamado-topo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.chamado-topo h3 {
  margin: 0;
  font-family: "Courier New", monospace;
}

/* LINHA DO TEMPO DO CHAMADO */
.etapas {
  display: flex;
  margin: 16px 0 6px;
}

.etapa {
  flex: 1;
  text-align: center;
  font-size: 12px;
  color: #9ca3af;
  position: relative;
}

.etapa .bola {
  width: 26px;
  height: 26px;
  line-height: 26px;
  margin: 0 auto 4px;
  border-radius: 50%;
  background: #e5e7eb;
  color: #6b7280;
  font-weight: bold;
  position: relative;
  z-index: 1;
}

.etapa::before {
  content: "";
  position: absolute;
  top: 12px;
  left: -50%;
  width: 100%;
  height: 3px;
  background: #e5e7eb;
}

.etapa:first-child::before { display: none; }

.etapa.feita { color: var(--azul); font-weight: bold; }
.etapa.feita .bola { background: #15803d; color: #fff; }
.etapa.feita::before { background: #15803d; }

.bloco {
  background: #fff;
  border-radius: 8px;
  padding: 10px 12px;
  margin-top: 10px;
}

.bloco h4 {
  margin: 0 0 6px;
  font-size: 13px;
  color: var(--azul);
  text-transform: uppercase;
}

.bloco p { margin: 5px 0; }

.descricao { white-space: pre-wrap; }

.pendente { color: #6b7280; font-style: italic; }

/* ÍCONES */
.ic {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
  vertical-align: -4px;
}

button .ic { margin-right: 6px; }
button .ic:last-child:not(:first-child) { margin: 0 0 0 6px; }

.menu .ico {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: rgba(255,255,255,.16);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
}

.menu .ico .ic { width: 26px; height: 26px; margin: 0; }

.menu button {
  transition: transform .15s, box-shadow .15s;
}

.menu button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(11,37,69,.25);
}

.selo span { display: inline-flex; align-items: center; gap: 6px; }
.selo span .ic { width: 15px; height: 15px; }

.card .hora { display: inline-flex; align-items: center; gap: 8px; }
.card a.maps { display: flex; align-items: center; justify-content: center; gap: 6px; }

/* FORMULÁRIO EM ETAPAS */
.wiz-topo { margin: 4px 0 18px; }

.wiz-passos {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

.wiz-passo {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #9ca3af;
  font-weight: bold;
}

.wiz-passo .n {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #e5e7eb;
  color: #6b7280;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  transition: background .3s, color .3s;
}

.wiz-passo .n .ic { width: 15px; height: 15px; margin: 0; }
.wiz-passo.ativo { color: var(--azul); }
.wiz-passo.ativo .n { background: var(--azul); color: #fff; box-shadow: 0 0 0 4px rgba(13,47,82,.12); }
.wiz-passo.feito { color: #15803d; }
.wiz-passo.feito .n { background: #15803d; color: #fff; }

.wiz-barra {
  height: 4px;
  background: #e5e7eb;
  border-radius: 4px;
  overflow: hidden;
}

.wiz-barra div {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--azul), var(--azul-claro));
  border-radius: 4px;
  transition: width .4s ease;
}

.wiz.entrar { animation: entrar .3s ease-out; }

@keyframes entrar {
  from { opacity: 0; transform: translateX(16px); }
  to { opacity: 1; transform: none; }
}

.wiz-titulo {
  margin: 0 0 4px;
  color: var(--azul);
  font-size: 19px;
}

.wiz-sub {
  margin: 0 0 14px;
  color: #6b7280;
  font-size: 14px;
}

.wiz-nav {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.wiz-nav button {
  display: flex;
  align-items: center;
  justify-content: center;
}

.wiz-nav .btn-sec { flex: 0 0 auto; padding: 12px 16px; }
.wiz-nav button:not(.btn-sec) { flex: 1; }

/* CARDS DE MOTIVO */
.tipos {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.tipo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  background: #fff;
  color: #1f2937;
  border: 2px solid #e5e7eb;
  border-radius: 14px;
  padding: 12px;
  transition: border-color .15s, box-shadow .15s, transform .15s;
}

.tipo:hover {
  border-color: var(--cor);
  box-shadow: 0 6px 16px rgba(0,0,0,.08);
  transform: translateY(-1px);
}

.tipo.sel {
  border-color: var(--cor);
  background: var(--fundo);
}

.tipo-ic {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  color: var(--cor);
  background: var(--fundo);
}

.tipo-ic .ic { width: 24px; height: 24px; margin: 0; }

.tipo-txt { flex: 1; min-width: 0; }

.tipo-txt strong {
  display: block;
  font-size: 15px;
  color: #111827;
  margin-bottom: 2px;
}

.tipo-txt small {
  display: block;
  font-size: 13px;
  color: #6b7280;
  line-height: 1.3;
}

.tipo-seta { color: #9ca3af; }
.tipo-seta .ic { margin: 0; }
.tipo.sel .tipo-seta { color: var(--cor); }

.tipo-escolhido {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 12px;
  margin-bottom: 14px;
  background: var(--fundo);
  border: 1px solid var(--cor);
}

.tipo-escolhido .tipo-ic { width: 34px; height: 34px; border-radius: 10px; }
.tipo-escolhido .tipo-ic .ic { width: 19px; height: 19px; }

.tipo-escolhido-txt {
  flex: 1;
  font-size: 14px;
  font-weight: bold;
  color: #111827;
}

.tipo-escolhido-txt small {
  display: block;
  font-weight: normal;
  font-size: 11px;
  color: #6b7280;
  text-transform: uppercase;
}

.tipo-escolhido button,
.resumo-topo button {
  width: auto;
  padding: 4px 10px;
  font-size: 13px;
  background: transparent;
  color: var(--azul);
  text-decoration: underline;
}

/* CAMPOS COM ÍCONE */
.com-ic { position: relative; }

.com-ic .ic {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #9ca3af;
  pointer-events: none;
  width: 18px;
  height: 18px;
}

.campo .com-ic input { padding-left: 40px; }
.campo.erro .com-ic .ic { color: #dc2626; }
.campo .com-ic input:focus + .ic,
.com-ic:focus-within .ic { color: var(--azul); }

.campo.tremer { animation: tremer .35s; }

@keyframes tremer {
  20%, 60% { transform: translateX(-5px); }
  40%, 80% { transform: translateX(5px); }
}

.btn-loc {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  color: var(--azul);
  border: 2px solid var(--azul-claro);
  font-size: 15px;
  font-weight: bold;
}

.btn-loc.buscando .ic { animation: girar 1s linear infinite; }

.loc-ok {
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: bold;
}

.loc-ok .ic { width: 15px; height: 15px; }

.ou {
  text-align: center;
  font-size: 12px;
  color: #9ca3af;
  margin: 8px 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.ou::before,
.ou::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #e5e7eb;
}

/* RESUMO ANTES DE ENVIAR */
.resumo {
  background: var(--cinza);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 14px;
}

.resumo-topo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
  color: var(--azul);
}

.resumo div:not(.resumo-topo) {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 4px 0;
  color: #374151;
}

.resumo div .ic { width: 16px; height: 16px; color: #6b7280; margin-top: 1px; }

.btn-enviar.enviando .ic { animation: voar .8s ease-in-out infinite; }

@keyframes voar {
  50% { transform: translate(3px, -3px); }
}

/* SUCESSO */
.sucesso {
  animation: aparecer .3s ease-out;
}

.check-anim {
  width: 72px;
  height: 72px;
  display: block;
  margin: 0 auto 4px;
}

.check-anim circle {
  stroke: #15803d;
  stroke-width: 3;
  stroke-dasharray: 151;
  stroke-dashoffset: 151;
  animation: tracar .6s ease-out forwards;
}

.check-anim path {
  stroke: #15803d;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 34;
  stroke-dashoffset: 34;
  animation: tracar .35s .5s ease-out forwards;
}

@keyframes tracar { to { stroke-dashoffset: 0; } }

.protocolo { animation: pulsar 1.2s .8s ease-in-out 2; }

@keyframes pulsar {
  50% { transform: scale(1.05); }
}

.acoes-linha { display: flex; gap: 8px; }

.acoes-linha button,
.sucesso .acoes > button {
  display: flex;
  align-items: center;
  justify-content: center;
}

.acoes-linha button { flex: 1; }
.acoes-linha button.ok { background: #dcfce7; color: #15803d; }

.link-btn {
  background: transparent;
  color: var(--azul);
  text-decoration: underline;
  font-size: 14px;
}

.etapa .bola { display: flex; align-items: center; justify-content: center; }
.etapa .bola .ic { width: 15px; height: 15px; margin: 0; }

.chamado-tipo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 4px 0 8px;
  font-weight: bold;
  color: #111827;
}

.chamado-tipo .tipo-ic { width: 34px; height: 34px; border-radius: 10px; }
.chamado-tipo .tipo-ic .ic { width: 19px; height: 19px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .check-anim circle, .check-anim path { stroke-dashoffset: 0; }
}
</style>
</head>

let idioma = "pt";
let tela = "inicio";   // inicio | roteiros | hora-extra | atendimento
let abaAtual = "nome";
let abaAt = "abrir";
let ultimosResultados = [];
let totalResultados = 0;
let renderAtual = null;   // redesenha o resultado da consulta quando o idioma muda
let renderAt = null;      // redesenha o resultado do atendimento quando o idioma muda

function t(chave, vars) {
  let txt = (TEXTOS[idioma] || TEXTOS.pt)[chave] || TEXTOS.pt[chave] || "";
  Object.keys(vars || {}).forEach(k => { txt = txt.replace("{" + k + "}", vars[k]); });
  return txt;
}

/* IDIOMA: português é o padrão; a escolha fica salva no navegador */
function trocarIdioma(novo) {
  idioma = TEXTOS[novo] ? novo : "pt";
  try { localStorage.setItem("portalBydIdioma", idioma); } catch (e) {}
  aplicarIdioma();
}

function aplicarIdioma() {
  const he = tela === "hora-extra";
  const at = tela === "atendimento";
  document.documentElement.lang = t("htmlLang");
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t(el.dataset.t); });
  document.querySelectorAll(".idiomas button").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === idioma)
  );
  document.getElementById("tituloHero").innerHTML = t(at ? "heroAt" : he ? "heroHE" : "hero");
  document.getElementById("seloTexto").innerHTML = ic(he ? "clock" : "bus") + t(he ? "seloHE" : "selo");
  document.getElementById("introConsulta").innerHTML = t(he ? "introHE" : "intro");
  document.getElementById("campoNome").placeholder = t("phNome");
  document.getElementById("campoEmail").placeholder = t("phEmail");
  document.getElementById("fRoteiro").placeholder = t("phRoteiro");
  document.title = t(at ? "tituloPaginaAt" : he ? "tituloPaginaHE" : "tituloPagina");
  renderWizard();
  if (renderAtual) renderAtual();
  if (renderAt) renderAt();
}

/* NAVEGAÇÃO ENTRE PÁGINAS
   #roteiros, #hora-extra, #atendimento e #atendimento/PROTOCOLO (abre a consulta do chamado) */
function irPara(destino) {
  const novo = destino === "inicio" ? "" : "#" + destino;
  if (location.hash === novo) return mostrarTela();
  if (!novo) {
    history.pushState(null, "", location.pathname + location.search);
    return mostrarTela();
  }
  location.hash = novo; // o evento hashchange chama mostrarTela
}

function mostrarTela() {
  const hash = decodeURIComponent(location.hash.replace("#", ""));
  const partes = hash.split("/");
  tela = ["roteiros", "hora-extra", "atendimento"].indexOf(partes[0]) > -1 ? partes[0] : "inicio";
  const he = tela === "hora-extra";
  const at = tela === "atendimento";

  document.body.classList.toggle("tema-he", he);
  document.body.classList.toggle("tema-at", at);
  document.getElementById("tela-inicio").classList.toggle("hidden", tela !== "inicio");
  document.getElementById("tela-consulta").classList.toggle("hidden", tela !== "roteiros" && !he);
  document.getElementById("tela-atendimento").classList.toggle("hidden", !at);
  document.getElementById("avisoHE").classList.toggle("hidden", !he);
  document.getElementById("btnAjuda").classList.toggle("hidden", at);

  renderAtual = null;
  document.getElementById("resultado").innerHTML = "";
  document.getElementById("campoNome").value = "";
  document.getElementById("campoEmail").value = "";

  if (at) {
    if (partes[1]) {
      trocarAbaAt("consultar");
      document.getElementById("campoProtocolo").value = partes[1];
      consultarChamado();
    } else if (!document.getElementById("resultadoAt").innerHTML) {
      trocarAbaAt(abaAt);
    }
  }

  aplicarIdioma();
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", mostrarTela);

/* TROCA DE ABAS DA CONSULTA */
function trocarAba(aba) {
  abaAtual = aba;
  document.getElementById("aba-nome").classList.toggle("hidden", aba !== "nome");
  document.getElementById("aba-email").classList.toggle("hidden", aba !== "email");
  document.querySelectorAll("#tabsConsulta button").forEach((b, i) =>
    b.classList.toggle("active", (i === 0) === (aba === "nome"))
  );
  renderAtual = null;
  document.getElementById("resultado").innerHTML = "";
  document.getElementById(aba === "nome" ? "campoNome" : "campoEmail").focus();
}

/* TROCA DE ABAS DO ATENDIMENTO */
function trocarAbaAt(aba) {
  abaAt = aba;
  document.getElementById("at-abrir").classList.toggle("hidden", aba !== "abrir");
  document.getElementById("at-consultar").classList.toggle("hidden", aba !== "consultar");
  document.querySelectorAll("#tabsAt button").forEach((b, i) =>
    b.classList.toggle("active", (i === 0) === (aba === "abrir"))
  );
  if (aba === "consultar") mostrarRecentes();
}

document.addEventListener("DOMContentLoaded", () => {
  pintarIcones();
  irPasso(1, false);

  /* ENTER PESQUISA */
  ["campoNome", "campoEmail"].forEach(id =>
    document.getElementById(id).addEventListener("keydown", e => {
      if (e.key === "Enter") buscar();
    })
  );
  document.getElementById("campoProtocolo").addEventListener("keydown", e => {
    if (e.key === "Enter") consultarChamado();
  });

  /* Máscara do telefone: (71) 99999-9999 */
  document.getElementById("fTelefone").addEventListener("input", e => {
    const d = e.target.value.replace(/\D/g, "").slice(0, 11);
    let v = d;
    if (d.length > 2) v = "(" + d.slice(0, 2) + ") " + d.slice(2);
    if (d.length > 6) v = "(" + d.slice(0, 2) + ") " + d.slice(2, d.length - 4) + "-" + d.slice(-4);
    e.target.value = v;
  });

  /* Contador de caracteres da descrição */
  document.getElementById("fDescricao").addEventListener("input", e => {
    document.getElementById("contador").textContent = e.target.value.length;
  });

  /* Tira o vermelho do campo assim que a pessoa corrige */
  document.querySelectorAll("#formChamado .campo").forEach(c =>
    c.addEventListener("input", () => {
      c.classList.remove("erro");
      const sec = c.closest(".wiz");
      if (sec && !sec.querySelector(".campo.erro")) sec.querySelector(".msg-passo").innerHTML = "";
    })
  );

  try {
    const salvo = localStorage.getItem("portalBydIdioma");
    if (TEXTOS[salvo]) idioma = salvo;
  } catch (e) {}
  mostrarTela();
});

/* Remove acentos e ignora maiúsculas/minúsculas */
function normalizar(txt) {
  return String(txt || "")
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();
}

/* Evita que dados da planilha quebrem o HTML */
function esc(txt) {
  return String(txt || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function chamarApi(corpo, url = API_URL) {
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(corpo)
  }).then(r => r.json());
}

/* Mostra uma mensagem traduzível no resultado */
function mostrarMsg(chave) {
  renderAtual = () => {
    document.getElementById("resultado").innerHTML = `<div class="msg fade">${t(chave)}</div>`;
  };
  renderAtual();
}

/* CONSULTA DE ROTEIROS / HORA EXTRA */
function buscar() {
  const resultado = document.getElementById("resultado");
  const loading = document.getElementById("loading");
  const btn = document.getElementById("btnBuscar");
  const termo = normalizar(document.getElementById(abaAtual === "nome" ? "campoNome" : "campoEmail").value);

  renderAtual = null;
  resultado.innerHTML = "";

  if (abaAtual === "nome" && termo.length < 3) return mostrarMsg("min3");
  if (abaAtual === "email" && termo.indexOf("@") === -1) return mostrarMsg("emailInvalido");

  loading.style.display = "block";
  btn.disabled = true;

  chamarApi({
    consulta: tela === "hora-extra" ? "horaExtra" : "roteiros",
    tipo: abaAtual,
    termo
  })
  .then(dados => {
    if (!dados.ok) return mostrarMsg("erroConexao");
    ultimosResultados = dados.resultados;
    totalResultados = dados.total;

    if (!dados.total) {
      mostrarMsg(tela === "hora-extra" ? "nadaHE" : "nada");
    } else if (dados.total === 1) {
      mostrarCard(0, false);
    } else {
      mostrarOpcoes();
    }
  })
  .catch(() => mostrarMsg("erroConexao"))
  .finally(() => {
    loading.style.display = "none";
    btn.disabled = false;
  });
}

/* VÁRIOS RESULTADOS: LISTA DE OPÇÕES */
function mostrarOpcoes() {
  renderAtual = mostrarOpcoes;
  const extra = totalResultados > ultimosResultados.length
    ? `<p class="msg">${t("mostrando", { a: ultimosResultados.length, b: totalResultados })}</p>`
    : "";

  document.getElementById("resultado").innerHTML = `
    <div class="fade">
    <p class="aviso-opcoes">${t("encontrados", { n: totalResultados })}</p>
    ${ultimosResultados.map((p, i) => `
      <button class="opcao" onclick="mostrarCard(${i}, true)">
        <strong>${esc(p.nome)}</strong>
        <small>${t("linhaCurto")}: ${esc(p.linha) || "-"} · ${t("pontoCurto")}: ${esc(p.referencia) || "-"}</small>
      </button>`).join("")}
    ${extra}
    </div>`;
}

/* CARD DO PASSAGEIRO */
function mostrarCard(i, comVoltar) {
  renderAtual = () => mostrarCard(i, comVoltar);
  const p = ultimosResultados[i];
  const maps = /^https?:\/\//i.test(p.maps) ? p.maps : "";

  document.getElementById("resultado").innerHTML = `
    <div class="card fade">
      ${tela === "hora-extra" ? `<span class="tag">${t("tag")}</span>` : ""}
      <h3>${esc(p.nome)}</h3>
      ${p.hora ? `<div class="hora">${ic("clock")}${esc(p.hora)}</div>` : ""}
      <p><strong>${t("linha")}:</strong> ${esc(p.linha) || "-"}</p>
      <p><strong>${t("referencia")}:</strong> ${esc(p.referencia) || "-"}</p>
      <p><strong>${t("endereco")}:</strong> ${esc(p.endereco) || "-"}</p>
      <p><strong>${t("email")}:</strong> ${esc(p.email) || "-"}</p>
      ${maps ? `<a class="maps" href="${esc(maps)}" target="_blank" rel="noopener">${ic("pin")}${t("maps")}</a>` : ""}
    </div>
    ${comVoltar ? `<button class="voltar" onclick="mostrarOpcoes()">${t("voltarOpcoes")}</button>` : ""}`;
}

/* BOTÃO "NÃO ENCONTROU SEUS DADOS?" LEVA AO ATENDIMENTO,

  abaAt = "abrir";

let tipoSel = -1;   // motivo escolhido no passo 1
let passo = 1;      // passo atual do formulário

function tituloTipo(o) {
  return (o[idioma] || o.pt)[0];

/* Redesenha o formulário quando o idioma muda */
function renderWizard() {
  renderTipos();
  renderEscolhido();
  if (passo === 3) renderResumo();
}

function escolherTipo(i) {
  tipoSel = i;
  renderTipos();
  renderEscolhido();
  setTimeout(() => irPasso(2), 250);
}

function irPasso(n, rolar = true) {
  if (n > 1 && tipoSel < 0) n = 1;
  passo = n;
  document.querySelectorAll("#formChamado .wiz").forEach(s =>
    s.classList.toggle("hidden", Number(s.dataset.p) !== n)
  );
  document.querySelectorAll("#formChamado .wiz-passo").forEach(p => {
    const k = Number(p.dataset.p);
    p.classList.toggle("ativo", k === n);
    p.classList.toggle("feito", k < n);
    p.querySelector(".n").innerHTML = k < n ? ic("check") : k;
  });
  document.getElementById("wizBarra").style.width = ((n - 1) / 2 * 100) + "%";
  const sec = document.querySelector(`#formChamado .wiz[data-p="${n}"]`);
  sec.classList.remove("entrar");
  void sec.offsetWidth; // reinicia a animação
  sec.classList.add("entrar");
  renderEscolhido();
  if (n === 3) renderResumo();
  if (rolar) document.getElementById("formChamado").scrollIntoView({ behavior: "smooth", block: "start" });
}

function marcarErros(ids, msgId) {
  document.querySelectorAll("#formChamado .campo").forEach(c => c.classList.remove("erro"));
  const msg = document.getElementById(msgId);
  if (!ids.length) { msg.innerHTML = ""; return true; }
  ids.forEach(id => {
    const c = document.getElementById(id);
    c.classList.add("erro");
    c.classList.remove("tremer");
    void c.offsetWidth;
    c.classList.add("tremer");
  });
  document.getElementById(ids[0]).scrollIntoView({ behavior: "smooth", block: "center" });
  msg.innerHTML = `<div class="msg fade">${t("corrija")}</div>`;
  return false;
}

function errosPasso2() {
  const v = id => document.getElementById(id).value.trim();
  const erros = [];
  if (v("fNome").split(/\s+/).length < 2) erros.push("c-nome");
  if (v("fTelefone").replace(/\D/g, "").length < 10) erros.push("c-telefone");
  if (v("fEndereco").length < 5) erros.push("c-endereco");
  if (v("fLocalizacao") && !/^https?:\/\//i.test(v("fLocalizacao"))) erros.push("c-localizacao");
  return erros;
}

function avancar() {
  if (marcarErros(errosPasso2(), "msgP2")) irPasso(3);
}

/* Preenche o link do Google Maps com a localização do celular */
function usarLocalizacao() {
  const btn = document.getElementById("btnLoc");
  const txt = document.getElementById("btnLocTxt");
  const ok = document.getElementById("locOk");
  if (!navigator.geolocation) return alert(t("locErro"));
  btn.disabled = true;
  btn.classList.add("buscando");
  txt.textContent = t("buscandoLoc");
  const fim = () => {
    btn.disabled = false;
    btn.classList.remove("buscando");
    txt.textContent = t("usarLoc");
  };
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude, longitude } = pos.coords;
    document.getElementById("fLocalizacao").value =
      "https://www.google.com/maps?q=" + latitude.toFixed(6) + "," + longitude.toFixed(6);
    document.getElementById("c-localizacao").classList.remove("erro");
    ok.classList.remove("hidden");
    fim();
  }, () => {
    alert(t("locErro"));
    fim();
  }, { enableHighAccuracy: true, timeout: 15000 });
}

function enviarChamado(ev) {
  ev.preventDefault();
  if (tipoSel < 0) return irPasso(1);
  if (errosPasso2().length) { irPasso(2); return avancar(); }

  const btn = document.getElementById("btnEnviar");
  const txt = document.getElementById("btnEnviarTxt");
  const d = {
    tipo: TIPOS_SOLICITACAO[tipoSel].valor,
    nome: document.getElementById("fNome").value.trim(),
    roteiro: document.getElementById("fRoteiro").value.trim(),
    telefone: document.getElementById("fTelefone").value.trim(),
    endereco: document.getElementById("fEndereco").value.trim(),
    localizacao: document.getElementById("fLocalizacao").value.trim(),
    descricao: document.getElementById("fDescricao").value.trim(),
    site: document.getElementById("fSite").value
  };

  if (!marcarErros(d.descricao.length < 5 ? ["c-descricao"] : [], "msgAbrir")) return;

  btn.disabled = true;
  btn.classList.add("enviando");
  txt.textContent = t("enviando");

  chamarApi(Object.assign({ acao: "abrirChamado" }, d), API_ATENDIMENTO_URL)
    .then(r => {
      if (!r.ok || !r.protocolo) throw new Error(r.erro || "erro");
      guardarProtocolo(r.protocolo);
      mostrarSucesso(r.protocolo);
    })
    .catch(() => {
      document.getElementById("msgAbrir").innerHTML = `<div class="msg fade">${t("erroEnvio")}</div>`;
    })
    .finally(() => {
      btn.disabled = false;
      btn.classList.remove("enviando");
      txt.textContent = t("enviar");
    });
}

function mostrarSucesso(protocolo) {
  const box = document.getElementById("sucessoChamado");
  document.getElementById("formChamado").classList.add("hidden");
  box.classList.remove("hidden");
  const p = esc(protocolo);
  renderAt = () => {
    box.innerHTML = `
      <div class="sucesso">
        <svg class="check-anim" viewBox="0 0 52 52" aria-hidden="true">
          <circle cx="26" cy="26" r="24" fill="none"/>
          <path fill="none" d="M15 27l7 7 15-15"/>
        </svg>
        <h3>${t("sucessoTitulo")}</h3>
        <p>${t("sucessoTexto")}</p>
        <div class="protocolo">${p}</div>
        <div class="acoes">
          <div class="acoes-linha">
            <button id="btnCopiar" class="btn-sec" onclick="copiarProtocolo('${p}')">${ic("copy")}<span>${t("copiar")}</span></button>
            ${navigator.share ? `<button class="btn-sec" onclick="compartilharProtocolo('${p}')">${ic("share")}<span>${t("compartilhar")}</span></button>` : ""}
          </div>
          <button onclick="irPara('atendimento/${p}')">${ic("search")}<span>${t("acompanhar")}</span></button>
          <button class="link-btn" onclick="novoChamado()">${t("novoChamado")}</button>
        </div>
      </div>`;
  };
  renderAt();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function copiarProtocolo(protocolo) {
  const feito = () => {
    const b = document.getElementById("btnCopiar");
    if (b) {
      b.innerHTML = ic("check") + `<span>${t("copiado")}</span>`;
      b.classList.add("ok");
    }
  };
  if (navigator.clipboard) navigator.clipboard.writeText(protocolo).then(feito).catch(() => prompt("", protocolo));
  else prompt("", protocolo);
}

function compartilharProtocolo(protocolo) {
  const url = location.origin + location.pathname + "#atendimento/" + protocolo;
  navigator.share({ title: t("tituloPaginaAt"), text: t("textoCompartilhar", { p: protocolo }), url }).catch(() => {});
}

function novoChamado() {
  renderAt = null;
  tipoSel = -1;
  document.getElementById("formChamado").reset();
  document.getElementById("contador").textContent = "0";
  document.getElementById("locOk").classList.add("hidden");
  document.getElementById("sucessoChamado").classList.add("hidden");
  document.getElementById("sucessoChamado").innerHTML = "";
  document.getElementById("formChamado").classList.remove("hidden");
  renderTipos();
  irPasso(1);
}

/* Protocolos abertos neste aparelho (atalho para consultar) */
function lerProtocolos() {
  try { return JSON.parse(localStorage.getItem("portalBydProtocolos") || "[]"); } catch (e) { return []; }
}

function guardarProtocolo(p) {
  const lista = [p].concat(lerProtocolos().filter(x => x !== p)).slice(0, 5);
  try { localStorage.setItem("portalBydProtocolos", JSON.stringify(lista)); } catch (e) {}
}

function mostrarRecentes() {
  const lista = lerProtocolos();
  document.getElementById("recentes").classList.toggle("hidden", !lista.length);
  document.getElementById("chips").innerHTML = lista.map(p =>
    `<button onclick="consultarProtocolo('${esc(p)}')">${esc(p)}</button>`
  ).join("");
}

function consultarProtocolo(p) {
  document.getElementById("campoProtocolo").value = p;
  consultarChamado();
}

function msgAt(chave) {
  renderAt = () => {
    document.getElementById("resultadoAt").innerHTML = `<div class="msg fade">${t(chave)}</div>`;
  };
  renderAt();
}

function consultarChamado() {
  const campo = document.getElementById("campoProtocolo");
  const btn = document.getElementById("btnConsultarAt");
  const protocolo = campo.value.toUpperCase().replace(/\s/g, "");
  campo.value = protocolo;

  if (protocolo.length < 8) return msgAt("protocoloInvalido");

  renderAt = null;
  document.getElementById("resultadoAt").innerHTML = "";
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>${t("carregando")}`;

  chamarApi({ acao: "consultarChamado", protocolo }, API_ATENDIMENTO_URL)
    .then(r => {
      if (!r.ok) return msgAt("erroConexao");
      if (!r.chamado) return msgAt("protocoloNaoEncontrado");
      renderAt = () => desenharChamado(r.chamado);
      renderAt();
    })
    .catch(() => msgAt("erroConexao"))
    .finally(() => {
      btn.disabled = false;
      btn.innerHTML = t("consultar");
    });
}

function desenharChamado(c) {
  const etapa = c.status === "finalizado" ? 3 : c.status === "andamento" ? 2 : 1;
  const etapas = [1, 2, 3].map(n => `
    <div class="etapa ${n <= etapa ? "feita" : ""}">
      <div class="bola">${n < etapa || etapa === 3 ? ic("check") : n}</div>${t("etapa" + n)}
    </div>`).join("");

  const tipo = TIPOS_SOLICITACAO.find(o => o.valor === c.tipo);

  document.getElementById("resultadoAt").innerHTML = `
    <div class="card fade">
      <div class="chamado-topo">
        <h3>${esc(c.protocolo)}</h3>
        <span class="status ${esc(c.status)}">${t("status_" + c.status)}</span>
      </div>
      <div class="etapas">${etapas}</div>

      <div class="bloco">
        <h4>${t("blocoChamado")}</h4>
        <p><strong>${t("aberto")}:</strong> ${esc(c.abertura) || "-"}</p>
        ${tipo
          ? `<div class="chamado-tipo" style="--cor:${tipo.cor};--fundo:${tipo.fundo}"><span class="tipo-ic">${ic(tipo.icone)}</span>${esc(tituloTipo(tipo))}</div>`
          : `<p><strong>${t("solicitacao")}:</strong> ${esc(c.tipo) || "-"}</p>`}
        <p><strong>${t("nomeChamado")}:</strong> ${esc(c.nome) || "-"}</p>
        ${c.roteiro ? `<p><strong>${t("roteiro")}:</strong> ${esc(c.roteiro)}</p>` : ""}
        <p><strong>${t("descricao")}:</strong></p>
        <p class="descricao">${esc(c.descricao) || "-"}</p>
      </div>

      <div class="bloco">
        <h4>${t("blocoAtendimento")}</h4>
        ${c.status === "recebido" ? `<p class="pendente">${t("aguardando")}</p>` : `
          <p><strong>${t("atendente")}:</strong> ${esc(c.atendente) || "-"}</p>
          <p><strong>${t("providencia")}:</strong> ${esc(c.providencia) || "-"}</p>
          <p><strong>${t("finalizadoEm")}:</strong> ${c.finalizado ? esc(c.finalizado) : `<span class="pendente">${t("status_andamento")}</span>`}</p>
        `}
      </div>
    </div>`;
}
</script>
